<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'self'; script-src 'self'"
    />
    <title>Phone Remote</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-mode="loading" data-phone="off">
    <main class="panel">
      <header class="top">
        <div class="brand"><span class="logo" aria-hidden="true"></span>Phone Remote</div>
        <span class="badge" id="badge">Starting</span>
      </header>

      <div class="intro">
        <h1 id="title">Starting…</h1>
        <p class="lead" id="lead"></p>
      </div>

      <section class="qr-card" id="qr-card" hidden>
        <img id="qr" alt="QR code that opens the remote on your phone" />
      </section>

      <div class="setup-code" id="setup-code-box" hidden>
        <span class="label">Setup code</span>
        <span class="code" id="setup-code"></span>
      </div>

      <div class="url" id="url" hidden></div>

      <button class="btn" id="copy" type="button" disabled>Copy link</button>

      <section class="note" id="public-note" role="note" hidden>
        <strong>Public Wi-Fi</strong>
        <span>Works fine. Others on this Wi-Fi could see the PIN screen, so keep your PIN to yourself.</span>
      </section>

      <footer class="foot">
        <span class="phone"><span class="dot" aria-hidden="true"></span><span id="phone">No phone connected</span></span>
        <button class="link" id="reset" type="button" hidden>Forgot PIN? Reset PIN</button>
      </footer>
      <div class="version">
        <span id="version"></span>
        <button class="link update" id="update" type="button" hidden></button>
      </div>
    </main>
    <script src="qr.js"></script>
  </body>
</html>
